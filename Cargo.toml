[package]
name = "aerocrop-nanoagent"
version = "0.3.0"
edition = "2021"
authors = ["Mouhamed Diop <diopdissy@gmail.com> - Evo High-Tech"]
description = "100% Pure Rust Sovereign Bio-Spatial NanoAgent, NASA Data Bank, Daemon & 3D Cockpit."

[dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
